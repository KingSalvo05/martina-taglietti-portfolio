<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 70" width="320" height="70" fill="none">
  <!-- Monogram Mark -->
  <g id="mark" transform="translate(6, 12)">
    <!-- Precision Grid / Registration Crosshair subtle background -->
    <circle cx="24" cy="24" r="22" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="2 2" fill="#FAF8F5"/>
    <!-- M Stroke in Dark Onyx -->
    <path d="M14 34V14L24 25L34 14V34" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- T Accent in Electric Blue / Coral Red -->
    <path d="M22 17H38" stroke="#FF4D30" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M30 17V34" stroke="#FF4D30" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Registration Marks -->
    <circle cx="24" cy="24" r="1.5" fill="#2563EB"/>
    <line x1="2" y1="24" x2="6" y2="24" stroke="#94A3B8" stroke-width="1.2"/>
    <line x1="42" y1="24" x2="46" y2="24" stroke="#94A3B8" stroke-width="1.2"/>
    <line x1="24" y1="2" x2="24" y2="6" stroke="#94A3B8" stroke-width="1.2"/>
    <line x1="24" y1="42" x2="24" y2="46" stroke="#94A3B8" stroke-width="1.2"/>
  </g>
  
  <!-- Wordmark -->
  <g transform="translate(68, 20)">
    <text x="0" y="16" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="800" letter-spacing="1.8" fill="#18181B">MARTINA TAGLIETTI</text>
    <text x="1" y="32" font-family="'Space Mono', 'JetBrains Mono', monospace" font-size="8.5" font-weight="600" letter-spacing="2.2" fill="#64748B">GRAPHIC DESIGNER • UI/UX</text>
  </g>
</svg>
